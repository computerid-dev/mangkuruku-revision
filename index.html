function zip(files){const te=new TextEncoder(),parts=[],cd=[],ks=Object.keys(files);let off=0,cs=0;
 for(const n of ks){const v=files[n],d=typeof v=='string'?te.encode(v):v,nm=te.encode(n),c=crc(d);
  const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x800,true);l.setUint32(14,c,true);l.setUint32(18,d.length,true);l.setUint32(22,d.length,true);l.setUint16(26,nm.length,true);parts.push(l,nm,d);

async function unzip(buf){const v=new DataView(buf),u=new Uint8Array(buf),td=new TextDecoder(),out={};let e=buf.byteLength-22;while(e>=0&&v.getUint32(e,true)!=0x06054b50)e--;if(e<0)throw Error('Bukan file ZIP');

 const o={nama:d.nama.trim(),kelasId:d.kelasId,programId:d.programId,ortu:d.ortu.trim(),wa:w,aktif:!!d.aktif},t=ed&&db.siswa.find(x=>x.id==ed);if(t)Object.assign(t,o);else db.siswa.push({id:uid(),...o});ed=null;done()},
